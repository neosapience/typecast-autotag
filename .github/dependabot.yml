version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "release-it"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@release-it/conventional-changelog"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "npm"
    directory: "/demo-html"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      demo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "pip"
    directory: "/python-binding"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "maven"
    directories:
      - "/java-binding"
      - "/java-binding/verification-test"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      java-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/c-binding"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Seoul"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # CentOS 6 is intentional: the C binding targets glibc 2.12 compatibility.
      - dependency-name: "quay.io/centos/centos"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "i386/centos"
        update-types:
          - "version-update:semver-major"
    groups:
      docker-dependencies:
        patterns:
          - "*"
