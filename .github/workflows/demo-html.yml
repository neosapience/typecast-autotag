name: Demo HTML
on:
  pull_request:
    paths: ['demo-html/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/demo-html.yml']
  push:
    branches: [main]
    paths: ['demo-html/**', 'src/**', 'package.json', 'pnpm-lock.yaml', '.github/workflows/demo-html.yml']
permissions:
  contents: read
jobs:
  demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
        with:
          version: 9.15.2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm install --frozen-lockfile && pnpm build && pnpm test && pnpm audit --audit-level=moderate
        working-directory: demo-html
