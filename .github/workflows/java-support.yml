name: Java bindings

on:
  pull_request:
    paths: ['java-binding/**', '.github/workflows/java-support.yml']
  push:
    branches: [main]
    paths: ['java-binding/**', '.github/workflows/java-support.yml']

permissions:
  contents: read

jobs:
  installed:
    name: Java ${{ matrix.java }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]
        java: ['8', '21']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - name: Verify JAR and bundled native library
        run: mvn --batch-mode --no-transfer-progress -f java-binding/pom.xml verify
