name: Java bindings

on:
  pull_request:
    paths: ['java-binding/**', 'c-binding/**', '.github/workflows/java-support.yml']
  push:
    branches: [main]
    paths: ['java-binding/**', 'c-binding/**', '.github/workflows/java-support.yml']

permissions:
  contents: read

jobs:
  installed:
    name: Java ${{ matrix.java }} ${{ matrix.architecture }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]
        java: ['8', '21']
        architecture: [x64]
        include:
          - os: windows-2022
            java: '8'
            architecture: x86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          architecture: ${{ matrix.architecture }}
          cache: maven
      - name: Verify JAR and bundled native library
        run: mvn --batch-mode --no-transfer-progress -f java-binding/pom.xml verify
