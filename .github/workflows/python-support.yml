name: Python support
on:
  pull_request:
    paths: ["python-binding/**", ".github/workflows/python-support.yml"]
  push:
    branches: [main]
    paths: ["python-binding/**", ".github/workflows/python-support.yml"]
permissions:
  contents: read
jobs:
  supported:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15-intel]
        python: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python-binding
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Build and validate distribution
        run: |
          python -m pip install build twine pytest
          python -m build
          python -m twine check dist/*
          python -m pip install --force-reinstall dist/*.whl
          python -m pip check
      - name: Test installed wheel and bundled native library
        run: |
          cd "${{ runner.temp }}"
          python -c "from importlib.metadata import metadata; m=metadata('typecast-autotag'); assert m['Version']=='2.0.0'; assert m['Requires-Python']=='>=3.10'"
          python -m pytest "${{ github.workspace }}/python-binding/tests" -v --import-mode=importlib
  rejected:
    name: Reject Python ${{ matrix.python }}
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ["3.8", "3.9"]
    defaults:
      run:
        working-directory: python-binding
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install build && python -m build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      - name: Verify unsupported interpreter cannot install the wheel
        run: |
          if python -m pip install --no-deps dist/*.whl > rejection.log 2>&1; then
            cat rejection.log
            echo "EOL interpreter unexpectedly accepted the new wheel"
            exit 1
          fi
          cat rejection.log
          grep -E "requires a different Python|Requires-Python" rejection.log
      - name: Verify last compatible published release remains installable
        run: |
          python -m pip install typecast-autotag==1.13.0
          cd "${{ runner.temp }}"
          python -c "from typecast_autotag import auto_tag; assert auto_tag('안녕하세요') == '안녕하세요'"
  audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Audit Python build and test tooling
        run: |
          python -m pip install --upgrade pip setuptools wheel build twine pytest pip-audit
          python -m pip_audit
      - name: Verify no Python runtime dependencies or legacy classifiers
        run: |
          python -c "import tomllib; p=tomllib.load(open('python-binding/pyproject.toml','rb'))['project']; assert p['dependencies']==[]; assert p['requires-python']=='>=3.10'; assert not any(c.endswith((':: 3.8',':: 3.9')) for c in p['classifiers'])"
